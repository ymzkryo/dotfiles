# mise グローバル設定（旧 ~/.tool-versions から移行）
# 参考: https://mise.jdx.dev/configuration.html
[settings]
# cpython のビルドには GitHub attestation が無いため検証を無効化
python.github_attestations = false

[env]
# --- macOS で mise の asdf:php プラグインが PHP をビルドできるようにするための設定 ---
# プラグインは古い formula 名(icu4c 無印 / openssl@1.1)を前提にしており、現行の
# Homebrew(icu4c@77 / openssl@3)を検出できず configure に失敗するため、ここで補う。
#
# (1) ICU: intl 拡張のビルドに必要。プラグインは `brew ls --versions icu4c`(無印)で
#     探すが実体は icu4c@77 のため見つからず PKG_CONFIG_PATH に入らない。
# (2) OpenSSL: プラグインは openssl@1.1 を探すが実体は openssl@3。openssl が無効だと
#     https ストリームラッパーが無く、PEAR インストール(https ダウンロード)で失敗する。
# 両方の pkg-config パスを通す。(/opt/homebrew/opt/xxx は linked keg を指すシンボリックリンク)
PKG_CONFIG_PATH = "/opt/homebrew/opt/icu4c/lib/pkgconfig:/opt/homebrew/opt/openssl@3/lib/pkgconfig:{{env.PKG_CONFIG_PATH | default(value='')}}"

# PEAR は legacy でこのプロジェクトは Composer 運用のためスキップ(https 依存の失敗も回避)。
# プラグインは composer を別途セットアップするので支障なし。
PHP_WITHOUT_PEAR = "yes"

# プラグインの os_based オプションを上書きし、openssl@3 と主要拡張を明示的に有効化する。
# (--enable-* 系や curl/gd/zip 等は global_config 側で常に付与されるのでここには不要)
# openssl は上の PKG_CONFIG_PATH 経由で openssl@3 を pkg-config が解決する。
PHP_CONFIGURE_OPTIONS = "--with-openssl --with-sodium=/opt/homebrew/opt/libsodium --with-gmp=/opt/homebrew/opt/gmp --with-gettext=/opt/homebrew/opt/gettext --with-readline=/opt/homebrew/opt/readline --with-iconv=/opt/homebrew/opt/libiconv"

[tools]
# rust は rustup(~/.rustup, ~/.cargo)で管理する。mise の core:rust は rustup が居ると
# ~/.cargo/bin へのシンボリックリンクを張るだけでバージョンを固定できないため、ここには置かない。
# ツールチェーンの切り替えは `rustup default <version>` を使う
go        = "1.24.3"
node      = "23.10.0"
python    = "3.12.0"
java      = "temurin-17.0.6+10"
terraform = "1.14.6"
gcloud    = "558.0.0"
# awscli 2.31.15 は aqua レジストリの保持範囲外だったため最新にピン留め（v2 は後方互換高）
awscli    = "2.35.15"
# 以下は asdf から移行（asdf 側のバージョンをそのまま引き継ぎ）
poetry    = "2.1.3"
pnpm      = "11.15.0"
# hugo は既定の aqua:gohugoio/hugo が標準ビルドしか持たず、SCSS のトランスパイルに
# 必要な extended ビルドを取得できないため、asdf バックエンドを明示する
"asdf:NeoHsu/asdf-hugo" = "extended-0.161.1"
